<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compiler Arcade: Lexer to AST Quest | PLC Midterm Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070a12;
      --bg-panel: #101726;
      --bg-card: #182238;
      --bg-code: #060911;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #a855f7;
      --border: #263554;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12), transparent 40%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP HUD NAVBAR */
    header.hud-bar {
      height: 68px;
      background: rgba(16, 23, 38, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #070a12;
      padding: 5px 10px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.78rem;
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-pill.xp { border-color: rgba(56, 189, 248, 0.4); color: var(--cyan); }
    .hud-pill.streak { border-color: rgba(245, 158, 11, 0.4); color: var(--amber); }
    .hud-pill.lives { border-color: rgba(244, 63, 94, 0.4); color: var(--rose); }
    .hud-pill.timer { border-color: rgba(168, 85, 247, 0.4); color: #e9d5ff; min-width: 92px; justify-content: center; }
    .hud-pill.timer.danger { background: rgba(244, 63, 94, 0.25); border-color: var(--rose); color: #fda4af; animation: pulse 0.6s infinite alternate; }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    /* MAIN CONTAINER */
    main.game-stage {
      flex: 1;
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-panel {
      background: rgba(16, 23, 38, 0.9);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px 38px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      animation: fadeSlide 0.28s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* DIFFICULTY SELECTOR CARDS */
    .diff-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 16px 0 24px;
    }

    .diff-card {
      background: rgba(24, 34, 56, 0.65);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .diff-card:hover {
      transform: translateY(-3px);
      background: rgba(24, 34, 56, 0.95);
    }

    .diff-card.selected.intern { border-color: var(--emerald); box-shadow: 0 0 24px rgba(16, 185, 129, 0.25); }
    .diff-card.selected.junior { border-color: var(--cyan); box-shadow: 0 0 24px rgba(56, 189, 248, 0.25); }
    .diff-card.selected.senior { border-color: var(--purple); box-shadow: 0 0 24px rgba(168, 85, 247, 0.25); }
    .diff-card.selected.expert { 
      border-color: var(--rose); 
      background: linear-gradient(145deg, rgba(244, 63, 94, 0.16), rgba(24, 34, 56, 0.95));
      box-shadow: 0 0 28px rgba(244, 63, 94, 0.35); 
    }

    .diff-badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: fit-content;
    }

    .diff-card h3 { font-size: 1.08rem; font-weight: 800; margin-bottom: 6px; }
    .diff-card p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 12px; }
    .diff-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: #cbd5e1;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }

    /* INPUTS & BUTTONS */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    .input-ctrl {
      width: 100%;
      background: var(--bg-code);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .input-ctrl:focus { border-color: var(--cyan); }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #070a12;
      border: none;
      font-weight: 800;
    }

    .btn-expert {
      background: linear-gradient(135deg, var(--rose), var(--amber));
      color: #070a12;
      border: none;
      font-weight: 900;
    }

    /* 3-STAGE PIPELINE PROGRESS BAR (STRICTLY LEXER -> TYPESCRIPT -> AST) */
    .stage-progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stage-step {
      background: rgba(16, 23, 38, 0.75);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stage-step.active {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.14);
      color: #fff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.2);
    }

    .stage-step.done {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
    }

    /* CHALLENGE HEADER & CODE DISPLAY */
    .challenge-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .kicker-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 99px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .code-terminal {
      background: var(--bg-code);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 18px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin: 14px 0 20px;
      overflow-x: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 3px 12px rgba(0,0,0,0.6);
    }

    /* STAGE 1: COIN SORTER (LEXER) BUCKETS */
    .token-tray {
      min-height: 78px;
      background: rgba(6, 9, 17, 0.8);
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .token-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .token-coin {
      background: var(--bg-card);
      border: 2px solid var(--cyan);
      border-radius: 10px;
      padding: 8px 14px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.15s ease;
      user-select: none;
    }

    .token-coin:hover {
      transform: translateY(-3px);
      background: rgba(56, 189, 248, 0.18);
    }

    .token-coin .t-val { font-size: 0.95rem; font-weight: 800; color: #fff; }
    .token-coin .t-type { font-size: 0.68rem; font-weight: 700; color: var(--cyan); margin-top: 2px; }

    /* STAGE 3: AST ORG CHART VISUALIZER */
    .ast-diagram {
      background: rgba(6, 9, 17, 0.78);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin: 16px 0 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .ast-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      width: 100%;
      flex-wrap: wrap;
    }

    .ast-slot {
      min-width: 210px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 2px dashed var(--cyan);
      text-align: center;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s ease;
    }

    .ast-slot.active-slot {
      border-style: solid;
      border-color: var(--amber);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
    }

    .ast-slot .slot-role {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .ast-slot .slot-val {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
    }

    /* MULTIPLE CHOICE / CODE OPTIONS */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 16px 0;
    }

    .option-btn {
      background: rgba(24, 34, 56, 0.75);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 15px 18px;
      text-align: left;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.86rem;
      line-height: 1.5;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: pre-wrap;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
    }

    /* FEEDBACK TOAST & ANALOGY BOX */
    .feedback-banner {
      padding: 16px 20px;
      border-radius: 12px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      animation: fadeSlide 0.2s ease-out;
    }

    .feedback-banner.correct {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
    }

    .feedback-banner.wrong {
      background: rgba(244, 63, 94, 0.16);
      border: 1px solid var(--rose);
      color: #fecdd3;
    }

    .hint-box {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(99, 102, 241, 0.12));
      border-left: 4px solid var(--amber);
      padding: 12px 16px;
      border-radius: 0 10px 10px 0;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #fde68a;
    }

    /* CERTIFICATE / COMPLETION CARD */
    .cert-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border: 2px solid var(--cyan);
      border-radius: 20px;
      padding: 32px;
      margin: 20px 0;
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 860px) {
      .diff-grid, .form-row, .options-grid, .stage-progress {
        grid-template-columns: 1fr;
      }
      .card-panel { padding: 22px; }
    }

    @media print {
      header.hud-bar, .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .cert-card { border: 2px solid #000; color: #000; background: #fff; }
    }
  </style>
</head>
<body>

  <!-- TOP HUD -->
  <header class="hud-bar">
    <div class="brand">
      <span class="brand-badge">PLC · MIDTERM AST ARCADE</span>
      <span>Lexer, TypeScript &amp; AST Quest</span>
    </div>

    <div class="hud-stats" id="hud-stats" style="display:none;">
      <div class="hud-pill" id="hud-diff-badge">🟢 INTERN</div>
      <div class="hud-pill xp">⚡ <span id="hud-xp">0</span> XP</div>
      <div class="hud-pill streak">🔥 <span id="hud-streak">0</span>x</div>
      <div class="hud-pill lives" id="hud-lives">❤️❤️❤️</div>
      <div class="hud-pill timer" id="hud-timer">⏱️ 30s</div>
      <button class="btn" id="sound-toggle" style="padding:6px 12px; font-size:0.8rem;">🔊 SFX</button>
      <button class="btn" id="quit-btn" style="padding:6px 12px; font-size:0.8rem;">🏠 Menu</button>
    </div>
  </header>

  <!-- MAIN STAGE -->
  <main class="game-stage" id="app-stage"></main>

  <script>
    /********************************************************************
     * 1. WEB AUDIO SYNTHESIZER (NO EXTERNAL ASSETS REQUIRED)
     ********************************************************************/
    let sfxEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = "sine", duration = 0.12, delay = 0) {
      if (!sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {}
    }

    function sfxClick() { playTone(520, "triangle", 0.07); }
    function sfxSuccess() {
      playTone(523.25, "sine", 0.1, 0);
      playTone(659.25, "sine", 0.1, 0.08);
      playTone(783.99, "sine", 0.18, 0.16);
    }
    function sfxError() {
      playTone(180, "sawtooth", 0.18, 0);
      playTone(140, "sawtooth", 0.22, 0.12);
    }
    function sfxFanfare() {
      [523, 659, 784, 1046].forEach((f, idx) => playTone(f, "triangle", 0.18, idx * 0.1));
    }

    /********************************************************************
     * 2. DIFFICULTY TIERS (INTERN -> JUNIOR -> SENIOR -> EXPERT)
     *    ALL 4 LEVELS ARE STRICTLY UP TO AST ONLY (NO PARSER ANYWHERE)
     ********************************************************************/
    const DIFFICULTIES = {
      intern: {
        id: "intern",
        name: "Intern",
        icon: "🟢",
        label: "🟢 INTERN (EASY)",
        timePerQ: 45,
        lives: 4,
        multiplier: 1.0,
        hintCost: 0,
        desc: "Fundamentals: Coin Sorter (Lexer), Labeled Kitchen Jars (TypeScript), and 2-level Office Org Charts (AST)."
      },
      junior: {
        id: "junior",
        name: "Junior Dev",
        icon: "🔵",
        label: "🔵 JUNIOR DEV (MEDIUM)",
        timePerQ: 35,
        lives: 3,
        multiplier: 1.5,
        hintCost: 25,
        desc: "7-token rules with strings, tokenize() cursor loops, Token & ComparisonNode interfaces, and 2-level OR ASTs."
      },
      senior: {
        id: "senior",
        name: "Senior Dev",
        icon: "🟣",
        label: "🟣 SENIOR DEV (HARD)",
        timePerQ: 25,
        lives: 3,
        multiplier: 2.0,
        hintCost: 50,
        desc: "Midterm Standard: Trap tokens, string quote loops, recursive ASTNode unions, and 3-level AND vs OR AST trees."
      },
      expert: {
        id: "expert",
        name: "Expert Architect",
        icon: "🔥",
        label: "🔥 EXPERT ARCHITECT",
        timePerQ: 20,
        lives: 2,
        multiplier: 3.0,
        hintCost: 100,
        desc: "Mastery Mode: 13-token rules, two-character operator bugs, discriminated unions, parentheses override & 3-level ASTs."
      }
    };

    /********************************************************************
     * 3. CURATED QUESTION BANK (24 QUESTIONS ACROSS ALL 4 LEVELS)
     *    STRICTLY:
     *    - Stage 1: The Lexer (Coin Sorter)
     *    - Stage 2: TypeScript ("Labeled Kitchen Jars") & Code Bugs
     *    - Stage 3: The AST ("Office Org Chart")
     ********************************************************************/
    const QUESTION_BANK = {
      // ==================== LEVEL 1: INTERN (EASY — 6 QUESTIONS) ====================
      intern: [
        {
          stage: 1,
          type: "lexer-sort",
          kicker: "STAGE 1 · THE LEXER (COIN SORTER)",
          prompt: "Act as the Lexer (Coin Sorter)! Click the tokens in exact left-to-right order for this Group 1 (Product Filter) rule:",
          rule: 'price > 100',
          target: [
            { val: "price", type: "FIELD" },
            { val: ">", type: "GT" },
            { val: "100", type: "NUMBER" }
          ],
          distractors: [
            { val: "price > 100", type: "RAW_STRING" }
          ],
          hint: "The Lexer skips spaces and sorts the field name (FIELD), the operator (GT), and the digits (NUMBER) into separate labeled tokens."
        },
        {
          stage: 1,
          type: "mcq",
          kicker: "STAGE 1 · COMPILER ANALOGIES (THE LEXER)",
          prompt: "Why do we compare Step 1—the Lexer (Tokenizer)—to a mechanical Coin Sorter?",
          code: `Input String:  "price > 100"\nLexer Output:  [ { type: "FIELD", value: "price" }, { type: "GT", value: ">" }, { type: "NUMBER", value: 100 } ]`,
          options: [
            "Because it breaks raw text into a flat list of labeled token buckets without deciding hierarchy yet",
            "Because it builds a 3-level corporate Org Chart showing who reports to whom",
            "Because it connects React directly to MongoDB Atlas",
            "Because it calculates the final true or false boolean answer immediately"
          ],
          correct: 0,
          hint: "A coin sorter drops mixed change into labeled trays (FIELD, GT, NUMBER)—it only produces a flat list of tokens!"
        },
        {
          stage: 2,
          type: "mcq",
          kicker: "STAGE 2 · JAVASCRIPT RULE BUG HUNT",
          prompt: "This hardcoded rule always prints 'Matches!' even when category is 'Books'. What is the bug on Line 3?",
          code: `1: let price = 150;\n2: let category = "Books";\n3: if (price > 100 && category = "Electronics") {\n4:   console.log("Matches!");\n5: }`,
          options: [
            "Line 3 uses a single '=' (assignment) instead of '===' (comparison), overwriting category to 'Electronics'",
            "Line 3 should use the word 'AND' instead of '&&' inside a standard JavaScript if-statement",
            "Line 1 should put quotes around 150",
            "Line 2 cannot store strings inside a let variable"
          ],
          correct: 0,
          hint: "In JavaScript, a single '=' assigns a value (which evaluates as truthy), whereas '===' compares two values!"
        },
        {
          stage: 2,
          type: "mcq",
          kicker: "STAGE 2 · TYPESCRIPT (LABELED KITCHEN JARS)",
          prompt: "We compare TypeScript types to 'Labeled Kitchen Jars'. What does this TokenType union protect us from?",
          code: `export type TokenType = "FIELD" | "NUMBER" | "STRING" | "GT" | "AND" | "OR";\n\nexport interface Token {\n  type: TokenType;\n  value: string | number;\n}`,
          options: [
            "It catches typos like type: 'NUMBR' in the code editor before we even run the program",
            "It makes the browser skip the Lexer step completely",
            "It automatically converts all numbers into strings",
            "It encrypts the rule string inside a database"
          ],
          correct: 0,
          hint: "Just like a kitchen jar labeled 'Sugar' prevents you from pouring in salt, TokenType stops invalid token labels at compile time."
        },
        {
          stage: 3,

        };
      });

      document.getElementById("start-game-btn").onclick = () => {
        const nameInput = document.getElementById("player-name").value.trim();
        state.playerName = nameInput || "Compiler Student";
        state.clientBrief = document.getElementById("player-brief").value;
        startGame(state.difficulty);
      };
    }

    /********************************************************************
     * 6. LAUNCH & MANAGE GAME LOOP
     ********************************************************************/
    function startGame(diffKey) {
      sfxClick();
      const diff = DIFFICULTIES[diffKey];
      state.questions = JSON.parse(JSON.stringify(QUESTION_BANK[diffKey]));
      state.qIndex = 0;
      state.xp = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.correctCount = 0;
      state.lives = diff.lives;
      state.locked = false;

      hudStats.style.display = "flex";
      document.getElementById("hud-diff-badge").textContent = diff.label;
      loadQuestion();
    }

    function updateHUD() {
      const diff = DIFFICULTIES[state.difficulty];
      document.getElementById("hud-xp").textContent = state.xp;
      document.getElementById("hud-streak").textContent = state.streak;
      document.getElementById("hud-lives").textContent = "❤️".repeat(Math.max(0, state.lives)) + "🖤".repeat(Math.max(0, diff.lives - state.lives));
      const timerEl = document.getElementById("hud-timer");
      timerEl.textContent = `⏱️ ${state.timeLeft}s`;
      timerEl.classList.toggle("danger", state.timeLeft <= 6);
    }

    function startTimer() {
      clearInterval(state.timerId);
      const diff = DIFFICULTIES[state.difficulty];
      state.timeLeft = diff.timePerQ;
      updateHUD();

      state.timerId = setInterval(() => {
        if (state.locked) return;
        state.timeLeft--;
        updateHUD();
        if (state.timeLeft <= 0) {
          clearInterval(state.timerId);
          handleAnswer(false, "⏱️ Time's up! The stage timer ran out.");
        }
      }, 1000);
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function loadQuestion() {
      if (state.qIndex >= state.questions.length || state.lives <= 0) {
        renderEndScreen();
        return;
      }

      state.locked = false;
      state.hintUsedOnCurrent = false;
      const q = state.questions[state.qIndex];

      if (q.type === "lexer-sort") {
        state.selectedTokens = [];
        state.availableTokens = shuffle([...q.target, ...(q.distractors || [])]);
      } else if (q.type === "ast-builder") {
        state.astValues = {};
        state.activeAstSlot = 0;
      } else if (q.type === "mcq") {
        // Dynamically shuffle MCQ options so Option A is NOT always the answer
        const taggedOptions = q.options.map((text, idx) => ({
          text,
          isCorrect: idx === q.correct
        }));
        const mixed = shuffle(taggedOptions);
        state.shuffledOptions = mixed.map(item => item.text);
        state.shuffledCorrectIndex = mixed.findIndex(item => item.isCorrect);
      }

      startTimer();
      renderCurrentQuestion();
    }

    /********************************************************************
     * 7. RENDER ACTIVE QUESTION (3 STAGES: LEXER -> TYPESCRIPT -> AST)
     ********************************************************************/
    function renderCurrentQuestion(feedbackHTML = "") {
      const q = state.questions[state.qIndex];
      const diff = DIFFICULTIES[state.difficulty];

      const stages = [
        { num: 1, name: "Stage 1: Lexer (🪙 Coin Sorter)" },
        { num: 2, name: "Stage 2: TypeScript (🫙 Labeled Jars)" },
        { num: 3, name: "Stage 3: AST (🏢 Office Org Chart)" }
      ];

      const progressHTML = `
        <div class="stage-progress">
          ${stages.map(s => `
            <div class="stage-step ${q.stage === s.num ? 'active' : (q.stage > s.num ? 'done' : '')}">
              <span>${s.name}</span>
              <span>${q.stage === s.num ? '◀ ACTIVE' : (q.stage > s.num ? '✓ DONE' : 'UP NEXT')}</span>
            </div>
          `).join("")}
        </div>
      `;

      let interactiveBody = "";

      // --- TYPE 1: COIN SORTER (LEXER) ---
      if (q.type === "lexer-sort") {
        interactiveBody = `
          <div class="code-terminal">Rule Input:   ${escapeHTML(q.rule)}</div>

          <div style="font-size:0.82rem; font-weight:700; color:var(--cyan); margin-bottom:6px; text-transform:uppercase;">
            📥 Sorted Token Tray (Click a token here to remove it):
          </div>
          <div class="token-tray" id="lexer-tray">
            ${state.selectedTokens.length === 0 
              ? `<span style="color:var(--text-muted); font-size:0.88rem;">Click tokens from the pool below in left-to-right order...</span>`
              : state.selectedTokens.map((t, idx) => `
                <div class="token-coin" data-remove="${idx}">
                  <span class="t-val">${escapeHTML(t.val)}</span>
                  <span class="t-type">${t.type}</span>
                </div>
              `).join("")
            }
          </div>

          <div style="font-size:0.82rem; font-weight:700; color:var(--amber); margin-bottom:6px; text-transform:uppercase;">
            🪙 Unsorted Coin Pool ${q.distractors?.length ? '(Beware of Trap Tokens!)' : ''}:
          </div>
          <div class="token-pool" id="lexer-pool">
            ${state.availableTokens.map((t, idx) => `
              <div class="token-coin" data-pick="${idx}">
                <span class="t-val">${escapeHTML(t.val)}</span>
                <span class="t-type">${t.type}</span>
              </div>
            `).join("")}
          </div>

          <div style="display:flex; gap:12px; justify-content:flex-end;">
            <button class="btn" id="clear-tokens-btn" ${state.locked ? 'disabled' : ''}>↺ Reset Tray</button>
            <button class="btn btn-primary" id="submit-lexer-btn" ${state.locked ? 'disabled' : ''}>✓ Verify Token Stream</button>
          </div>
        `;
      }

      // --- TYPE 2: AST ORG CHART BUILDER ---
      else if (q.type === "ast-builder") {
        let treeLayoutHTML = "";

        if (q.layout === "two-level") {
          treeLayoutHTML = `
            <div class="ast-row">
              ${renderAstSlot(0, q.slots[0])}
            </div>
            <div style="color:var(--cyan); font-family:'JetBrains Mono'; font-weight:700;">╱ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ╲</div>
            <div class="ast-row">
              ${renderAstSlot(1, q.slots[1])}
              ${renderAstSlot(2, q.slots[2])}
            </div>
          `;
        } else if (q.layout === "three-level-right") {
          treeLayoutHTML = `
            <div class="ast-row">${renderAstSlot(0, q.slots[0])}</div>
            <div style="color:var(--cyan); font-family:'JetBrains Mono'; font-weight:700;">╱ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ╲</div>
            <div class="ast-row">
              ${renderAstSlot(1, q.slots[1])}
              ${renderAstSlot(2, q.slots[2])}
            </div>
            <div style="color:var(--amber); font-family:'JetBrains Mono'; font-weight:700; padding-left:220px;">╱ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ╲</div>
            <div class="ast-row" style="padding-left:180px;">
              ${renderAstSlot(3, q.slots[3])}
              ${renderAstSlot(4, q.slots[4])}
            </div>
          `;
        } else if (q.layout === "three-level-left") {
          treeLayoutHTML = `
            <div class="ast-row">${renderAstSlot(0, q.slots[0])}</div>
            <div style="color:var(--cyan); font-family:'JetBrains Mono'; font-weight:700;">╱ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ╲</div>
            <div class="ast-row">
              ${renderAstSlot(1, q.slots[1])}
              ${renderAstSlot(4, q.slots[4])}
            </div>
            <div style="color:var(--amber); font-family:'JetBrains Mono'; font-weight:700; padding-right:220px;">╱ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ╲</div>
            <div class="ast-row" style="padding-right:180px;">
              ${renderAstSlot(2, q.slots[2])}
              ${renderAstSlot(3, q.slots[3])}
            </div>
          `;
        }

        interactiveBody = `
          <div class="code-terminal">Rule Input:   ${escapeHTML(q.rule)}</div>
          <div class="ast-diagram">
            ${treeLayoutHTML}
          </div>
          <div style="font-size:0.82rem; font-weight:700; color:var(--amber); margin-bottom:8px; text-transform:uppercase;">
            🏢 Click a Node Value to Assign to the Highlighted Org Chart Slot:
          </div>
          <div class="token-pool">
            ${q.choices.map(c => `
              <button class="btn" data-ast-choice="${escapeHTML(c)}" ${state.locked ? 'disabled' : ''} style="font-family:'JetBrains Mono';">
                [ ${escapeHTML(c)} ]
              </button>
            `).join("")}
          </div>
          <div style="display:flex; justify-content:flex-end; margin-top:10px;">
            <button class="btn btn-primary" id="submit-ast-btn" ${state.locked ? 'disabled' : ''}>✓ Lock In AST Org Chart</button>
          </div>
        `;
      }

      // --- TYPE 3: MULTIPLE CHOICE (SHUFFLED OPTIONS) ---
      else if (q.type === "mcq") {
        interactiveBody = `
          ${q.code ? `<div class="code-terminal">${escapeHTML(q.code)}</div>` : ""}
          <div class="options-grid">
            ${state.shuffledOptions.map((opt, idx) => `
              <button class="option-btn" data-opt="${idx}" ${state.locked ? 'disabled' : ''}>
                <span style="color:var(--cyan); font-weight:800; margin-right:8px;">[${String.fromCharCode(65 + idx)}]</span>${escapeHTML(opt)}
              </button>
            `).join("")}
          </div>
        `;
      }

      appStage.innerHTML = `
        ${progressHTML}
        <div class="card-panel">
          <div class="challenge-kicker">
            <span class="kicker-tag">${q.kicker}</span>
            <span style="font-family:'JetBrains Mono'; font-size:0.84rem; color:var(--text-muted);">
              CHALLENGE ${state.qIndex + 1} OF ${state.questions.length}
            </span>
          </div>

          <h2 style="font-size:1.35rem; font-weight:800; line-height:1.38; margin-bottom:8px;">
            ${q.prompt}
          </h2>

          ${interactiveBody}

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); flex-wrap:wrap; gap:10px;">
            <button class="btn" id="hint-btn" ${state.locked || state.hintUsedOnCurrent ? 'disabled' : ''} style="font-size:0.82rem;">
              💡 Request Analogy Hint (${diff.hintCost === 0 ? 'FREE' : '-' + diff.hintCost + ' XP'})
            </button>
            <span style="font-size:0.8rem; color:var(--text-muted);">Assigned Group: <b>${escapeHTML(state.clientBrief)}</b></span>
          </div>

          ${state.hintUsedOnCurrent ? `<div class="hint-box"><b>💡 Instructor Hint:</b> ${escapeHTML(q.hint)}</div>` : ""}
          ${feedbackHTML}
        </div>
      `;

      bindQuestionEvents(q);
    }

    function renderAstSlot(idx, slotObj) {
      const val = state.astValues[idx] || "Click to Fill";
      const isActive = state.activeAstSlot === idx;
      return `
        <div class="ast-slot ${isActive ? 'active-slot' : ''}" data-slot="${idx}">
          <span class="slot-role">${slotObj.role}</span>
          <span class="slot-val">${escapeHTML(val)}</span>
        </div>
      `;
    }

    /********************************************************************
     * 8. EVENT HANDLERS & GRADING LOGIC
     ********************************************************************/
    function bindQuestionEvents(q) {
      const diff = DIFFICULTIES[state.difficulty];

      const hintBtn = document.getElementById("hint-btn");
      if (hintBtn) {
        hintBtn.onclick = () => {
          sfxClick();
          state.hintUsedOnCurrent = true;
          state.xp = Math.max(0, state.xp - diff.hintCost);
          updateHUD();
          renderCurrentQuestion();
        };
      }

      if (q.type === "lexer-sort" && !state.locked) {
        document.querySelectorAll("[data-pick]").forEach(el => {
          el.onclick = () => {
            sfxClick();
            const idx = Number(el.dataset.pick);
            state.selectedTokens.push(state.availableTokens[idx]);
            state.availableTokens.splice(idx, 1);
            renderCurrentQuestion();
          };
        });

        document.querySelectorAll("[data-remove]").forEach(el => {
          el.onclick = () => {
            sfxClick();
            const idx = Number(el.dataset.remove);
            state.availableTokens.push(state.selectedTokens[idx]);
            state.selectedTokens.splice(idx, 1);
            renderCurrentQuestion();
          };
        });

        document.getElementById("clear-tokens-btn").onclick = () => {
          sfxClick();
          state.availableTokens.push(...state.selectedTokens);
          state.selectedTokens = [];
          renderCurrentQuestion();
        };

        document.getElementById("submit-lexer-btn").onclick = () => {
          const isMatch = state.selectedTokens.length === q.target.length &&
            state.selectedTokens.every((t, i) => t.val === q.target[i].val && t.type === q.target[i].type);
          const expectedStr = q.target.map(t => `[${t.val}:${t.type}]`).join(" ");
          handleAnswer(
            isMatch,
            isMatch
              ? "Spot-on token stream! The Coin Sorter labeled every token accurately."
              : `Token mismatch! Expected order: ${expectedStr}`
          );
        };
      }

      if (q.type === "ast-builder" && !state.locked) {
        document.querySelectorAll("[data-slot]").forEach(el => {
          el.onclick = () => {
            sfxClick();
            state.activeAstSlot = Number(el.dataset.slot);
            renderCurrentQuestion();
          };
        });

        document.querySelectorAll("[data-ast-choice]").forEach(el => {
          el.onclick = () => {
            sfxClick();
            state.astValues[state.activeAstSlot] = el.dataset.astChoice;
            if (state.activeAstSlot < q.slots.length - 1) {
              state.activeAstSlot++;
            }
            renderCurrentQuestion();
          };
        });

        document.getElementById("submit-ast-btn").onclick = () => {
          const isMatch = q.slots.every((s, idx) => state.astValues[idx] === s.answer);
          const expectedSummary = q.slots.map(s => `${s.role}: [${s.answer}]`).join(" | ");
          handleAnswer(
            isMatch,
            isMatch
              ? "AST Org Chart verified! Boss and child nodes are wired with proper hierarchy."
              : `Org Chart hierarchy error! Correct structure: ${expectedSummary}`
          );
        };
      }

      if (q.type === "mcq" && !state.locked) {
        document.querySelectorAll("[data-opt]").forEach(btn => {
          btn.onclick = () => {
            const picked = Number(btn.dataset.opt);
            const isCorrect = picked === state.shuffledCorrectIndex;
            const correctOptionLetter = String.fromCharCode(65 + state.shuffledCorrectIndex);
            const correctOptionText = state.shuffledOptions[state.shuffledCorrectIndex];
            handleAnswer(
              isCorrect,
              isCorrect
                ? "Stage check passed! Clean logic."
                : `Incorrect! Correct answer was [${correctOptionLetter}]: ${correctOptionText}`
            );
          };
        });
      }
    }

    function handleAnswer(isCorrect, message) {
      clearInterval(state.timerId);
      state.locked = true;
      const diff = DIFFICULTIES[state.difficulty];

      if (isCorrect) {
        sfxSuccess();
        state.streak++;
        if (state.streak > state.maxStreak) state.maxStreak = state.streak;
        state.correctCount++;
        const timeBonus = state.timeLeft * 3;
        const streakBonus = state.streak * 25;
        const earned = Math.round((120 + timeBonus + streakBonus) * diff.multiplier);
        state.xp += earned;
        message += ` (+${earned} XP)`;
      } else {
        sfxError();
        state.streak = 0;
        state.lives--;
      }

      updateHUD();

      const feedbackHTML = `
        <div class="feedback-banner ${isCorrect ? 'correct' : 'wrong'}">
          <div>
            <strong>${isCorrect ? '✅ STAGE CHECK PASSED!' : '❌ LEXER / AST ERROR!'}</strong>
            <div style="font-size:0.9rem; margin-top:4px; white-space:pre-wrap;">${escapeHTML(message)}</div>
          </div>
          <button class="btn ${isCorrect ? 'btn-primary' : ''}" id="next-q-btn">
            ${(state.qIndex + 1 < state.questions.length && state.lives > 0) ? 'Next Challenge ▶' : 'View Final Results 🏆'}
          </button>
        </div>
      `;

      renderCurrentQuestion(feedbackHTML);

      document.getElementById("next-q-btn").onclick = () => {
        sfxClick();
        state.qIndex++;
        loadQuestion();
      };
    }

    /********************************************************************
     * 9. END SCREEN & VERIFIABLE COMPLETION CERTIFICATE
     ********************************************************************/
    function renderEndScreen() {
      clearInterval(state.timerId);
      sfxFanfare();
      const diff = DIFFICULTIES[state.difficulty];
      const totalQ = state.questions.length;
      const accuracy = Math.round((state.correctCount / totalQ) * 100);
      const survived = state.lives > 0;

      const rawHash = `${state.playerName}-${state.difficulty}-${state.xp}-${accuracy}`;
      let hashNum = 0;
      for (let i = 0; i < rawHash.length; i++) {
        hashNum = ((hashNum << 5) - hashNum) + rawHash.charCodeAt(i);
        hashNum |= 0;
      }
      const verifyCode = `AST-${diff.id.toUpperCase().slice(0,3)}-${Math.abs(hashNum).toString(16).toUpperCase().slice(0, 6)}`;

      let rankTitle = "🪙 Apprentice Coin Sorter (Lexer)";
      if (accuracy === 100 && state.difficulty === "expert") rankTitle = "👑 GRANDMASTER AST ARCHITECT";
      else if (state.difficulty === "expert" && survived) rankTitle = "🔥 Certified Expert AST Architect";
      else if (accuracy >= 80) rankTitle = "🏢 Senior AST Org Chart Engineer";
      else if (accuracy >= 60) rankTitle = "🫙 TypeScript & Tokenizer Builder";

      appStage.innerHTML = `
        <div class="card-panel">
          <div style="text-align:center; margin-bottom:18px;">
            <span class="kicker-tag">${survived ? 'LEXER TO AST CAMPAIGN COMPLETE' : 'RUN HALTED · OUT OF LIVES'}</span>
            <h1 style="font-size:2.2rem; font-weight:900; margin-top:10px;">
              ${survived ? '🎉 Midterm AST Quest Cleared!' : '💥 Out of Lives — Try Again!'}
            </h1>
          </div>

          <!-- PRINTABLE / SCREENSHOT CERTIFICATE -->
          <div class="cert-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:16px;">
              <div>
                <div style="font-family:'JetBrains Mono'; font-size:0.78rem; color:var(--cyan); font-weight:800;">
                  PROGRAMMING LANGUAGES WITH COMPILER · INSTRUCTOR: RON HEDWIG
                </div>
                <h2 style="font-size:1.6rem; font-weight:900; margin-top:4px;">${escapeHTML(state.playerName)}</h2>
                <div style="font-size:0.9rem; color:var(--text-muted); margin-top:2px;">${escapeHTML(state.clientBrief)}</div>
              </div>
              <div style="text-align:right;">
                <span class="kicker-tag" style="font-size:0.85rem;">${diff.label}</span>
                <div style="font-family:'JetBrains Mono'; font-size:0.78rem; color:var(--text-muted); margin-top:6px;">
                  VERIFY CODE: <b>${verifyCode}</b>
                </div>
              </div>
            </div>

            <div class="diff-grid" style="margin-top:20px; margin-bottom:10px;">
              <div style="background:rgba(0,0,0,0.25); padding:14px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-muted);">FINAL SCORE</div>
                <div style="font-size:1.65rem; font-weight:900; color:var(--cyan); font-family:'JetBrains Mono';">${state.xp} XP</div>
              </div>
              <div style="background:rgba(0,0,0,0.25); padding:14px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-muted);">ACCURACY</div>
                <div style="font-size:1.65rem; font-weight:900; color:var(--emerald); font-family:'JetBrains Mono';">${accuracy}% (${state.correctCount}/${totalQ})</div>
              </div>
              <div style="background:rgba(0,0,0,0.25); padding:14px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-muted);">MAX STREAK</div>
                <div style="font-size:1.65rem; font-weight:900; color:var(--amber); font-family:'JetBrains Mono';">${state.maxStreak}x 🔥</div>
              </div>
              <div style="background:rgba(0,0,0,0.25); padding:14px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-muted);">EARNED RANK</div>
                <div style="font-size:0.95rem; font-weight:800; color:#fff; margin-top:4px;">${rankTitle}</div>
              </div>
            </div>
          </div>

          <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:22px;">
            <button class="btn" onclick="window.print()">🖨️ Print / Save Certificate as PDF</button>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <button class="btn" id="change-diff-btn">⚙️ Change Difficulty Level</button>
              ${state.difficulty !== "expert" ? `
                <button class="btn btn-expert" id="try-expert-btn">🔥 Try Expert Architect Level</button>
              ` : `
                <button class="btn btn-primary" id="replay-btn">↺ Replay Expert Level</button>
              `}
            </div>
          </div>
        </div>
      `;

      document.getElementById("change-diff-btn").onclick = () => renderStartScreen();
      const tryExpertBtn = document.getElementById("try-expert-btn");
      if (tryExpertBtn) {
        tryExpertBtn.onclick = () => {
          state.difficulty = "expert";
          startGame("expert");
        };
      }
      const replayBtn = document.getElementById("replay-btn");
      if (replayBtn) {
        replayBtn.onclick = () => startGame(state.difficulty);
      }
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Boot Arcade
    renderStartScreen();
  </script>
</body>
</html>
