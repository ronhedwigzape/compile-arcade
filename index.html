<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLC Course Hub & AST Arcade (Weeks 1–4) | Ron Hedwig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #131b2e;
      --bg-card: #1c2742;
      --bg-code: #090d16;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --primary: #6366f1;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --purple: #a855f7;
      --border: #263554;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP NAVIGATION BAR */
    header.navbar {
      height: 62px;
      background: rgba(19, 27, 46, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.96rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent), var(--primary));
      color: #0b0f19;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.76rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      color: var(--accent);
      background: var(--accent-glow);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .nav-btn.arcade-highlight {
      border-color: rgba(245, 158, 11, 0.45);
      color: #fde68a;
      background: rgba(245, 158, 11, 0.12);
    }

    .nav-btn.arcade-highlight.active {
      background: linear-gradient(135deg, var(--warning), var(--danger));
      color: #090d16;
      font-weight: 800;
      border-color: transparent;
    }

    /* MAIN VIEWPORT */
    main#app-viewport {
      flex: 1;
      position: relative;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* SLIDE DECK ENGINE */
    .presentation-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 62px);
      overflow: hidden;
      background: radial-gradient(circle at 85% 15%, rgba(99, 102, 241, 0.12), transparent 45%),
                  radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.1), transparent 45%);
    }

    .slide-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      overflow: hidden;
      position: relative;
    }

    .slide-card {
      width: 100%;
      max-width: 1180px;
      height: 100%;
      max-height: 680px;
      background: rgba(19, 27, 46, 0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 42px 54px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow-y: auto;
      animation: slideEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .slide-card.title-slide {
      background: linear-gradient(135deg, #131b2e 0%, #1e1b4b 100%);
      border-color: rgba(99, 102, 241, 0.45);
      justify-content: center;
      align-items: flex-start;
    }

    .slide-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 16px;
    }

    .slide-kicker {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-family: 'JetBrains Mono', monospace;
    }

    .slide-counter-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .slide-headline {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 14px;
      color: #ffffff;
    }

    .title-slide .slide-headline {
      font-size: 3.1rem;
      margin-top: 12px;
    }

    .slide-sub {
      font-size: 1.16rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .info-card {
      background: rgba(28, 39, 66, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .info-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .info-card h4 {
      font-size: 1.05rem;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-card p {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .analogy-box {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(99, 102, 241, 0.12));
      border-left: 4px solid var(--warning);
      padding: 16px 20px;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .analogy-box .analogy-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--warning);
      margin-bottom: 4px;
    }

    .code-block {
      background: var(--bg-code);
      border: 1px solid #1e293b;
      border-radius: var(--radius);
      padding: 18px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(28, 39, 66, 0.55);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 12px;
    }

    .step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    .step-num.check { background: var(--success); }

    /* 3-STAGE PIPELINE BAR (STRICTLY UP TO AST) */
    .pipeline-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pipe-step {
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .pipe-step.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .pipe-step.done {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    /* SLIDE CONTROLS FOOTER */
    .slide-controls {
      height: 62px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover:not(:disabled) {
      background: #263554;
      border-color: var(--accent);
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--primary));
      color: #090d16;
      font-weight: 800;
      border: none;
    }

    .btn-expert {
      background: linear-gradient(135deg, var(--danger), var(--warning));
      color: #090d16;
      font-weight: 900;
      border: none;
    }

    select.week-select, .input-field, textarea.code-input {
      background: var(--bg-code);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }

    .input-field, textarea.code-input {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 8px;
    }

    /* PAGE CONTAINER */
    .page-container {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px 80px;
    }

    .page-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 { font-size: 1.95rem; font-weight: 800; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      background: var(--accent-glow);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    /* TOKEN CHIPS & ARCADE INTERACTIVES */
    .token-chip, .token-coin {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 8px 14px;
      margin: 4px;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
      transition: all 0.15s ease;
    }

    .token-coin { cursor: pointer; }
    .token-coin:hover { transform: translateY(-3px); background: rgba(56, 189, 248, 0.18); }
    .token-chip .t-val, .token-coin .t-val { font-weight: 800; color: #fff; font-size: 0.95rem; }
    .token-chip .t-type, .token-coin .t-type { font-size: 0.68rem; color: var(--accent); font-weight: 700; margin-top: 2px; }

    .token-tray {
      min-height: 76px;
      background: rgba(9, 13, 22, 0.85);
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
    }

    /* ARCADE DIFFICULTY CARDS & HUD */
    .arcade-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(19, 27, 46, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hud-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .diff-card {
      background: rgba(28, 39, 66, 0.65);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .diff-card:hover { transform: translateY(-3px); background: rgba(28, 39, 66, 0.95); }
    .diff-card.selected.intern { border-color: var(--success); box-shadow: 0 0 22px rgba(16, 185, 129, 0.25); }
    .diff-card.selected.junior { border-color: var(--accent); box-shadow: 0 0 22px rgba(56, 189, 248, 0.25); }
    .diff-card.selected.senior { border-color: var(--purple); box-shadow: 0 0 22px rgba(168, 85, 247, 0.25); }
    .diff-card.selected.expert { border-color: var(--danger); box-shadow: 0 0 26px rgba(244, 63, 94, 0.35); background: linear-gradient(145deg, rgba(244, 63, 94, 0.15), rgba(28, 39, 66, 0.95)); }

    .ast-diagram {
      background: rgba(9, 13, 22, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin: 14px 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ast-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      width: 100%;
      flex-wrap: wrap;
    }

    .ast-slot {
      min-width: 205px;
      padding: 11px 15px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 2px dashed var(--accent);
      text-align: center;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .ast-slot.active-slot {
      border-style: solid;
      border-color: var(--warning);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
    }

    .ast-slot .slot-role { font-size: 0.68rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .ast-slot .slot-val { font-size: 0.94rem; font-weight: 800; color: #fff; }

    .option-btn {
      background: rgba(28, 39, 66, 0.75);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      cursor: pointer;
      white-space: pre-wrap;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    .feedback-banner {
      padding: 15px 18px;
      border-radius: 12px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .feedback-banner.correct { background: rgba(16, 185, 129, 0.16); border: 1px solid var(--success); color: #a7f3d0; }
    .feedback-banner.wrong { background: rgba(244, 63, 94, 0.16); border: 1px solid var(--danger); color: #fecdd3; }

    /* PRINTABLE EXAM SHEETS */
    .print-toolbar {
      background: rgba(28, 39, 66, 0.85);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 22px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .exam-sheets-wrapper { display: flex; flex-direction: column; gap: 32px; }

    .exam-paper {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 40px 48px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .exam-paper.hidden-exam { display: none; }

    .exam-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .exam-header-top h2 { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
    .exam-header-top p { font-size: 0.86rem; color: #334155; margin-top: 2px; }

    .exam-score-box {
      border: 2px solid #0f172a;
      padding: 8px 16px;
      text-align: center;
      min-width: 120px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .exam-meta-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 0.8fr;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .exam-meta-line { border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .exam-section { margin-bottom: 22px; }
    .exam-section h3 { font-size: 0.98rem; font-weight: 800; margin-bottom: 6px; color: #0f172a; text-transform: uppercase; }
    .exam-section p.exam-prompt { font-size: 0.9rem; color: #1e293b; margin-bottom: 10px; line-height: 1.45; }

    .exam-code {
      background: #f8fafc;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      color: #0f172a;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .exam-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .exam-table th, .exam-table td { border: 1px solid #475569; padding: 8px 12px; text-align: left; font-size: 0.85rem; height: 34px; }
    .exam-table th { background: #f1f5f9; font-weight: 700; }

    .exam-draw-box {
      border: 1.5px dashed #475569;
      border-radius: 8px;
      height: 185px;
      width: 100%;
      padding: 10px;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 12px;
    }

    .exam-lined-area { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; margin-bottom: 14px; }
    .exam-line { border-bottom: 1px solid #64748b; height: 18px; width: 100%; }

    @page { size: A4 portrait; margin: 14mm 16mm; }

    @media print {
      html, body, main#app-viewport {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #000000 !important;
        display: block !important;
      }
      header.navbar, .no-print, .print-toolbar, .page-header, .slide-controls, .arcade-hud { display: none !important; }
      .page-container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .exam-paper { border: none !important; box-shadow: none !important; padding: 0 !important; page-break-after: always !important; }
      .exam-paper:last-of-type { page-break-after: auto !important; }
      .exam-paper.hidden-exam { display: none !important; }
    }

    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-4, .exam-meta-grid, .pipeline-bar { grid-template-columns: 1fr; }
      .slide-card { padding: 24px; max-height: none; }
      .slide-headline { font-size: 1.65rem; }
    }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION (SCOPED UP TO AST ONLY) -->
  <header class="navbar">
    <div class="brand">
      <span class="brand-badge">PLC · WEEKS 1–4</span>
      <span>Lexer to AST Course Hub</span>
    </div>
    <nav class="nav-links" id="main-nav">
      <a href="#/slides" class="nav-btn active" data-route="slides">🖥️ Slides (W1–W4: Up to AST)</a>
      <a href="#/arcade" class="nav-btn arcade-highlight" data-route="arcade">🕹️ Midterm AST Arcade</a>
      <a href="#/playground" class="nav-btn" data-route="playground">⚡ Lexer → AST Playground</a>

    let sfxEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = "sine", duration = 0.12, delay = 0) {
      if (!sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.11, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {}
    }

        currentSlideIndex = Number(e.target.value);

    function changeSlide(delta) {
      const next = currentSlideIndex + delta;
      if (next >= 0 && next < SLIDES.length) {
        currentSlideIndex = next;
        if ((window.location.hash.replace("#/", "") || "slides") === "slides") {
          renderSlidesView(document.getElementById("app-viewport"));
        }
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    }

    window.addEventListener("keydown", (e) => {
      const activeRoute = window.location.hash.replace("#/", "") || "slides";
      if (activeRoute !== "slides") return;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); changeSlide(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); changeSlide(-1); }
      else if (e.key.toLowerCase() === "f") { e.preventDefault(); toggleFullScreen(); }
    });

    /********************************************************************
     * 6. VIEW 2: EMBEDDED MIDTERM AST ARCADE (INTERN -> EXPERT)
     ********************************************************************/
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startArcadeRun(container) {
      const diff = DIFFICULTIES[arcade.difficulty];
      arcade.questions = JSON.parse(JSON.stringify(QUESTION_BANK[arcade.difficulty]));
      arcade.qIndex = 0;
      arcade.xp = 0;
      arcade.streak = 0;
      arcade.maxStreak = 0;
      arcade.correctCount = 0;
      arcade.lives = diff.lives;
      arcade.screen = "play";
      loadArcadeQuestion(container);
    }

    function loadArcadeQuestion(container) {
      clearInterval(arcade.timerId);
      if (arcade.qIndex >= arcade.questions.length || arcade.lives <= 0) {
        arcade.screen = "end";
        renderArcadeEnd(container);
        return;
      }

      const diff = DIFFICULTIES[arcade.difficulty];
      const q = arcade.questions[arcade.qIndex];
      arcade.locked = false;
      arcade.hintUsed = false;
      arcade.timeLeft = diff.timePerQ;

      if (q.type === "lexer-sort") {
        arcade.selectedTokens = [];
        arcade.availableTokens = shuffle([...q.target, ...(q.distractors || [])]);
      } else if (q.type === "ast-builder") {
        arcade.astValues = {};
        arcade.activeAstSlot = 0;
      } else if (q.type === "mcq") {
        const tagged = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
        const mixed = shuffle(tagged);
        arcade.shuffledOptions = mixed.map(i => i.text);
        arcade.shuffledCorrectIndex = mixed.findIndex(i => i.isCorrect);
      }

      arcade.timerId = setInterval(() => {
        if (arcade.locked) return;
        arcade.timeLeft--;
        const timerEl = document.getElementById("arc-timer");
        if (timerEl) timerEl.textContent = `⏱️ ${arcade.timeLeft}s`;
        if (arcade.timeLeft <= 0) {
          clearInterval(arcade.timerId);
          gradeArcadeAnswer(container, false, "⏱️ Time's up! Stage timed out.");
        }
      }, 1000);

      renderArcadeQuestion(container);
    }

    function renderArcadeQuestion(container, feedbackHTML = "") {
      const diff = DIFFICULTIES[arcade.difficulty];
      const q = arcade.questions[arcade.qIndex];
      const livesStr = "❤️".repeat(Math.max(0, arcade.lives)) + "🖤".repeat(Math.max(0, diff.lives - arcade.lives));

      const stages = [
        { num: 1, name: "1. Lexer (🪙 Coin Sorter)" },
        { num: 2, name: "2. TypeScript (🫙 Labeled Jars)" },
        { num: 3, name: "3. AST (🏢 Office Org Chart)" }
      ];

      let body = "";

      if (q.type === "lexer-sort") {
        body = `
          <div class="code-block" style="margin:12px 0;">Rule Input:   ${escapeHTML(q.rule)}</div>

          gradeArcadeAnswer(container, ok, ok ? "AST Org Chart verified! Boss and child nodes match." : `Hierarchy mismatch! Expected: ${exp}`);
        };

      if (q.type === "mcq" && !arcade.locked) {

          btn.onclick = () => {
            const picked = Number(btn.dataset.opt);
            const ok = picked === arcade.shuffledCorrectIndex;

            gradeArcadeAnswer(container, ok, ok ? "Compiler check passed!" : `Compiler error! Correct option was [${letter}]: ${arcade.shuffledOptions[arcade.shuffledCorrectIndex]}`);
          };

    function gradeArcadeAnswer(container, isCorrect, msg) {
      clearInterval(arcade.timerId);
      arcade.locked = true;
      const diff = DIFFICULTIES[arcade.difficulty];

      if (isCorrect) {
        sfxSuccess();
        arcade.streak++;
        if (arcade.streak > arcade.maxStreak) arcade.maxStreak = arcade.streak;
        arcade.correctCount++;
        const earned = Math.round((120 + arcade.timeLeft * 3 + arcade.streak * 25) * diff.multiplier);
        arcade.xp += earned;
        msg += ` (+${earned} XP)`;
      } else {
        sfxError();
        arcade.streak = 0;
        arcade.lives--;

    /********************************************************************
     * 7. VIEW 3: LIVE LEXER -> AST PLAYGROUND (STRICTLY UP TO AST ONLY)
     ********************************************************************/
    const PRESETS = [
      { name: "Group 1 — Brief 1: Product Filter (Simple AND)", rule: 'price > 100 AND category = "Electronics"' },
      { name: "Group 2 — Brief 2: Loan Eligibility (Simple OR)", rule: 'income >= 35000 OR creditScore >= 700' },
      { name: "Group 3 — Brief 4: Invoice Approval (NEQ & GTE)", rule: 'amount >= 10000 AND vendor != "Internal"' },
      { name: "Midterm Precedence: AND Binds Tighter Than OR", rule: 'vip = "Gold" OR price > 100 AND stock > 0' },
      { name: "Expert Override: Parentheses Before AND", rule: '(vip = "Gold" OR price > 100) AND stock > 0' }
    ];

    function tokenizeRule(input) {
      const tokens = [];
      let i = 0;
      while (i < input.length) {
        const ch = input[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (ch === "(") { tokens.push({ type: "LPAREN", value: "(" }); i++; continue; }
        if (ch === ")") { tokens.push({ type: "RPAREN", value: ")" }); i++; continue; }
        if (ch === '"' || ch === "'") {
          const quote = ch;
          let str = "";
          i++;
          while (i < input.length && input[i] !== quote) { str += input[i++]; }
          i++;
          tokens.push({ type: "STRING", value: str });
          continue;
        }
        if (/[0-9]/.test(ch)) {
          let num = "";
          while (i < input.length && /[0-9.]/.test(input[i])) { num += input[i++]; }
          tokens.push({ type: "NUMBER", value: Number(num) });
          continue;
        }
        const twoChar = input.slice(i, i + 2);
        if (twoChar === ">=") { tokens.push({ type: "GTE", value: ">=" }); i += 2; continue; }
        if (twoChar === "<=") { tokens.push({ type: "LTE", value: "<=" }); i += 2; continue; }
        if (twoChar === "!=") { tokens.push({ type: "NEQ", value: "!=" }); i += 2; continue; }
        if (twoChar === "==") { tokens.push({ type: "EQ", value: "==" }); i += 2; continue; }
        if (ch === ">") { tokens.push({ type: "GT", value: ">" }); i++; continue; }
        if (ch === "<") { tokens.push({ type: "LT", value: "<" }); i++; continue; }
        if (ch === "=") { tokens.push({ type: "EQ", value: "=" }); i++; continue; }
        if (/[a-zA-Z_]/.test(ch)) {
          let ident = "";
          while (i < input.length && /[a-zA-Z0-9_]/.test(input[i])) { ident += input[i++]; }
          const upper = ident.toUpperCase();
          if (upper === "AND" || upper === "OR") {
            tokens.push({ type: upper, value: upper });
          } else {
            tokens.push({ type: "FIELD", value: ident });
          }
          continue;
        }
        i++;
      }
      return tokens;
    }

    function buildASTFromTokens(tokens) {
      let pos = 0;
      function parsePrimary() {
        if (tokens[pos] && tokens[pos].type === "LPAREN") {
          pos++; // consume '('
          const expr = parseOr();
          if (tokens[pos] && tokens[pos].type === "RPAREN") pos++; // consume ')'
          return expr;
        }
        const field = tokens[pos++];
        const op = tokens[pos++];
        const val = tokens[pos++];
        if (!field || !op || !val) throw new Error("Incomplete comparison expression.");
        return {
          type: "Comparison",
          field: field.value,
          operator: op.value,
          value: val.value
        };
      }
      function parseAnd() {
        let left = parsePrimary();
        while (pos < tokens.length && tokens[pos].type === "AND") {
          pos++;
          const right = parsePrimary();
          left = { type: "LogicalExpr", operator: "AND", left, right };
        }
        return left;
      }
      function parseOr() {
        let left = parseAnd();
        while (pos < tokens.length && tokens[pos].type === "OR") {
          pos++;
          const right = parseAnd();
          left = { type: "LogicalExpr", operator: "OR", left, right };
        }
        return left;
      }
      return tokens.length ? parseOr() : null;
    }

    function formatAsciiTree(node, prefix = "", isLeft = true) {
      if (!node) return "";
      if (node.type === "Comparison") {
        const valStr = typeof node.value === "string" ? `"${node.value}"` : node.value;
        return `${prefix}${isLeft ? "├── " : "└── "}[Comparison] ${node.field} ${node.operator} ${valStr}\n`;
      }
      let out = `${prefix}${prefix ? (isLeft ? "├── " : "└── ") : ""}[Boss: LogicalExpr (${node.operator})]\n`;
      const nextPrefix = prefix + (prefix ? (isLeft ? "│   " : "    ") : "");
      out += formatAsciiTree(node.left, nextPrefix, true);
      out += formatAsciiTree(node.right, nextPrefix, false);
      return out;
    }

              <div class="code-block" style="margin-top:10px;">export type TokenType =
  | "FIELD" | "NUMBER" | "STRING"
  | "GT" | "LT" | "GTE" | "LTE" | "EQ" | "NEQ"
  | "AND" | "OR" | "LPAREN" | "RPAREN";

export interface Token {
  type: TokenType;
  value: string | number;
}

export function tokenize(input: string): Token[] {
  const tokens: Token[] = [];
  let i = 0;
  while (i < input.length) {
    if (/\\s/.test(input[i])) { i++; continue; }
    // Check 2-char operators (>=, <=, !=, ==) BEFORE 1-char (>, <, =)
    const two = input.slice(i, i + 2);
    if (two === ">=") { tokens.push({ type: "GTE", value: ">=" }); i += 2; continue; }
    if (input[i] === ">") { tokens.push({ type: "GT", value: ">" }); i++; continue; }
    // Numbers, quoted strings, and identifiers (AND, OR, FIELD)
    i++;
  }
  return tokens;
}</div>

export interface ComparisonNode {
  type: "Comparison";
  field: string;

export interface LogicalExprNode {

  right: ASTNode;
}</div>
